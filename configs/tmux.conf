set -g prefix C-a
unbind C-b
bind C-a send-prefix
unbind ^A
bind ^A select-pane -t :.+

setw -g mode-keys vi
set -g mouse on
set -g xterm-keys on
set -g set-clipboard on
set -g default-terminal "screen-256color"
set -g history-limit 5000
set -g escape-time 10
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

bind -n C-Space send-keys Escape
bind -n C-Up send-keys PageUp
bind -n C-Down send-keys PageDown

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 2
bind J resize-pane -D 1
bind K resize-pane -U 1
bind L resize-pane -R 2

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 24
set -g status-right-length 80
set -g status-style "bg=black,fg=colour250"
set -g status-left "#[fg=colour141,bold]#S #[fg=colour241]| "
set -g status-right "#[fg=colour212]#(cut -d' ' -f1 /proc/loadavg) #[fg=colour84]#(awk '/MemAvailable/ { printf \"%dM\", $2/1024 }' /proc/meminfo) #[fg=colour220]#(cat /sys/class/power_supply/axp20x-battery/capacity 2>/dev/null || printf -- '--')%% #[fg=colour117]%H:%M"
set -g window-status-current-style "bg=colour236,fg=colour231,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
